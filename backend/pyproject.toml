[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gridrag-backend"
version = "1.0.0"
description = "GridRAG backend powered by FastAPI, MySQL, Chroma, LangChain, and Qwen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=24.1.0",
  "alembic>=1.15.2",
  "asyncmy>=0.2.10",
  "celery[redis]>=5.4.0",
  "chromadb>=1.0.8",
  "cryptography>=42.0.0",
  "fastapi>=0.115.12",
  "FlagEmbedding>=1.3.4",
  "httpx>=0.28.1",
  "jieba>=0.42.1",
  "jinja2>=3.1.6",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "openai>=1.76.2",
  "openpyxl>=3.1.5",
  "pydantic-settings>=2.9.1",
  "pypdf>=5.4.0",
  "PyJWT>=2.10.1",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "pymysql>=1.1.1",
  "rank-bm25>=0.2.2",
  "redis>=6.0.0",
  "sentence-transformers>=4.1.0",
  "sqlalchemy>=2.0.40",
  "structlog>=25.3.0",
  "uvicorn[standard]>=0.34.2"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.8",
  "types-aiofiles>=24.1.0.20250822",
  "types-openpyxl>=3.1.5.20250919"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = []
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["FlagEmbedding", "celery"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning"
]
